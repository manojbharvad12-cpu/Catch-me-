<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Catch Me</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --primary: #38bdf8;
      --accent: #f43f5e;
      --win-color: #22c55e;
      --text: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .game-container {
      width: 100%;
      max-width: 400px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--primary);
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }

    .stats-card {
      display: flex;
      gap: 15px;
    }

    .badge {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
    }

    .status-bar {
      margin-bottom: 20px;
      font-size: 16px;
      font-weight: 600;
      color: #94a3b8;
      min-height: 24px;
    }

    .board {
      width: 320px;
      height: 320px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 12px;
      background: rgba(30, 41, 59, 0.5);
      padding: 12px;
      border-radius: 20px;
      border: 2px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
    }

    .cell {
      background: var(--card-bg);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      font-weight: 900;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
    }

    .cell:active {
      transform: scale(0.94);
    }

    .cell.x {
      color: var(--primary);
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
    }

    .cell.o {
      color: var(--accent);
      text-shadow: 0 0 10px rgba(244, 63, 94, 0.6);
    }

    .cell.win {
      background: rgba(34, 197, 94, 0.25);
      border: 2px solid var(--win-color);
      animation: pulse 0.8s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.05); }
    }

    .controls {
      margin-top: 25px;
      display: flex;
      gap: 15px;
    }

    .btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
      transition: 0.2s;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-secondary {
      background: #475569;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 24px;
      border-radius: 20px;
      text-align: center;
      width: 100%;
      max-width: 300px;
    }

    .modal-content h2 {
      margin-bottom: 10px;
      font-size: 22px;
    }

    .modal-content p {
      color: #94a3b8;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <header>
      <div class="title">CATCH ME</div>
      <div class="stats-card">
        <div class="badge" id="levelBadge">Lvl 1</div>
        <div class="badge" id="scoreBadge">Win: 0</div>
      </div>
    </header>

    <div class="status-bar" id="statusBar">Tamaro vaaro (X)</div>

    <div class="board" id="board">
      <div class="cell" data-index="0"></div>
      <div class="cell" data-index="1"></div>
      <div class="cell" data-index="2"></div>
      <div class="cell" data-index="3"></div>
      <div class="cell" data-index="4"></div>
      <div class="cell" data-index="5"></div>
      <div class="cell" data-index="6"></div>
      <div class="cell" data-index="7"></div>
      <div class="cell" data-index="8"></div>
    </div>

    <div class="controls">
      <button class="btn btn-secondary" onclick="resetRound()">Reset Round</button>
    </div>
  </div>

  <div class="modal" id="resultModal">
    <div class="modal-content">
      <h2 id="modalTitle">Victory!</h2>
      <p id="modalMsg">Level Clear!</p>
      <button class="btn" id="modalBtn" onclick="nextRoundAction()">Next</button>
    </div>
  </div>

  <script>
    let currentLevel = parseInt(localStorage.getItem('catchme_level')) || 1;
    let totalWins = parseInt(localStorage.getItem('catchme_wins')) || 0;
    
    // Board representation: array of 9 elements (null or 'X' or 'O')
    let board = Array(9).fill(null);
    let isGameActive = true;

    const WINNING_LINES = [
      [0, 1, 2], // Row 1
      [3, 4, 5], // Row 2
      [6, 7, 8], // Row 3
      [0, 3, 6], // Col 1
      [1, 4, 7], // Col 2
      [2, 5, 8], // Col 3 (Loop-hole fix)
      [0, 4, 8], // Diag 1
      [2, 4, 6]  // Diag 2
    ];

    const cells = document.querySelectorAll('.cell');
    const statusBar = document.getElementById('statusBar');
    const levelBadge = document.getElementById('levelBadge');
    const scoreBadge = document.getElementById('scoreBadge');
    const resultModal = document.getElementById('resultModal');
    const modalTitle = document.getElementById('modalTitle');
    const modalMsg = document.getElementById('modalMsg');
    const modalBtn = document.getElementById('modalBtn');

    function updateHeader() {
      levelBadge.innerText = `Lvl ${currentLevel}`;
      scoreBadge.innerText = `Win: ${totalWins}`;
    }

    cells.forEach((cell, idx) => {
      cell.addEventListener('click', () => handleCellClick(idx));
    });

    function handleCellClick(idx) {
      if (!isGameActive || board[idx] !== null) return;

      // 1. Player move
      applyMove(idx, 'X');

      if (checkWinner('X')) {
        handleEnd('win');
        return;
      }

      if (board.every(cell => cell !== null)) {
        handleEnd('draw');
        return;
      }

      // 2. AI Turn
      isGameActive = false;
      statusBar.innerText = "Computer vichare chhe...";
      setTimeout(playAITurn, 260);
    }

    function applyMove(index, symbol) {
      board[index] = symbol;
      const cell = cells[index];
      cell.innerText = symbol;
      cell.classList.add(symbol.toLowerCase());
    }

    function playAITurn() {
      const emptySlots = [];
      board.forEach((val, i) => {
        if (val === null) emptySlots.push(i);
      });

      if (emptySlots.length === 0) return;

      let move = null;

      // PRIORITY 1: Can AI Win right now?
      move = scanForWinningSlot('O');

      // PRIORITY 2: CRITICAL BLOCK -> Does Player have 2 in a row? BLOCK IMMEDIATELY!
      if (move === null) {
        move = scanForWinningSlot('X');
      }

      // PRIORITY 3: Strategic Center or Corners
      if (move === null) {
        if (board[4] === null) {
          move = 4; // Center
        } else {
          const corners = [0, 2, 6, 8].filter(i => board[i] === null);
          if (corners.length > 0) {
            move = corners[Math.floor(Math.random() * corners.length)];
          } else {
            move = emptySlots[Math.floor(Math.random() * emptySlots.length)];
          }
        }
      }

      // Apply AI Move
      applyMove(move, 'O');

      if (checkWinner('O')) {
        handleEnd('lose');
        return;
      }

      if (board.every(cell => cell !== null)) {
        handleEnd('draw');
        return;
      }

      isGameActive = true;
      statusBar.innerText = "Tamaro vaaro (X)";
    }

    // Direct, flawless line scanner for both WIN and BLOCK
    function scanForWinningSlot(symbol) {
      for (let i = 0; i < WINNING_LINES.length; i++) {
        const [a, b, c] = WINNING_LINES[i];
        const line = [board[a], board[b], board[c]];
        
        let symCount = 0;
        let nullIdx = null;

        if (line[0] === symbol) symCount++;
        else if (line[0] === null) nullIdx = a;

        if (line[1] === symbol) symCount++;
        else if (line[1] === null) nullIdx = b;

        if (line[2] === symbol) symCount++;
        else if (line[2] === null) nullIdx = c;

        // If exactly 2 are matching and 1 is empty -> THAT is the spot to win or block!
        if (symCount === 2 && nullIdx !== null) {
          return nullIdx;
        }
      }
      return null;
    }

    function checkWinner(symbol) {
      for (let i = 0; i < WINNING_LINES.length; i++) {
        const [a, b, c] = WINNING_LINES[i];
        if (board[a] === symbol && board[b] === symbol && board[c] === symbol) {
          cells[a].classList.add('win');
          cells[b].classList.add('win');
          cells[c].classList.add('win');
          return true;
        }
      }
      return false;
    }

    function handleEnd(result) {
      isGameActive = false;

      if (result === 'win') {
        totalWins++;
        currentLevel++;
        localStorage.setItem('catchme_level', currentLevel);
        localStorage.setItem('catchme_wins', totalWins);
        updateHeader();

        modalTitle.innerText = "Superb Victory! 🎉";
        modalTitle.style.color = "var(--win-color)";
        modalMsg.innerText = `Level ${currentLevel - 1} Clear! Have Level ${currentLevel} ma aavi gaya chho.`;
        modalBtn.innerText = "Play Next Level";
      } else if (result === 'lose') {
        modalTitle.innerText = "Computer Won! 🤖";
        modalTitle.style.color = "var(--accent)";
        modalMsg.innerText = "Aa round tame hari gaya. Farithi try karo!";
        modalBtn.innerText = "Try Again";
      } else {
        modalTitle.innerText = "Round Draw! 🤝";
        modalTitle.style.color = "#fbbf24";
        modalMsg.innerText = "Draw thayo! Farithi ramvu padse.";
        modalBtn.innerText = "Retry";
      }

      resultModal.classList.add('show');
    }

    function nextRoundAction() {
      resultModal.classList.remove('show');
      resetRound();
    }

    function resetRound() {
      board = Array(9).fill(null);
      cells.forEach(cell => {
        cell.innerText = "";
        cell.className = "cell";
      });
      isGameActive = true;
      statusBar.innerText = "Tamaro vaaro (X)";
      updateHeader();
    }

    updateHeader();
  </script>
</body>
</html>
