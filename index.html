<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Game Hub Master</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: linear-gradient(180deg, #1f77b4 0%, #0c3e66 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 30px 20px;
    }

    .top-header {
      width: 100%;
      max-width: 320px;
      display: flex;
      justify-content: flex-end;
    }

    .icon-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      font-size: 20px;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      cursor: pointer;
    }

    .brand-box {
      text-align: center;
      margin-top: 15px;
    }

    .crown-icon {
      font-size: 34px;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
    }

    .brand-title {
      font-size: 44px;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 6px 0 #082947, 0 10px 20px rgba(0,0,0,0.4);
      letter-spacing: 1px;
      line-height: 1.1;
    }

    .menu-list {
      width: 100%;
      max-width: 310px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 40px;
    }

    .menu-btn {
      width: 100%;
      padding: 16px 20px;
      border: none;
      border-radius: 20px;
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 15px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 8px 0 rgba(0,0,0,0.25), 0 15px 25px rgba(0,0,0,0.3);
      transition: transform 0.08s;
    }

    .menu-btn:active {
      transform: translateY(4px);
      box-shadow: 0 4px 0 rgba(0,0,0,0.25);
    }

    .btn-ttt {
      background: linear-gradient(180deg, #ff6b6b 0%, #d9383a 100%);
      border-top: 2px solid #ffa8a8;
    }

    .btn-bb {
      background: linear-gradient(180deg, #06d6a0 0%, #049f76 100%);
      border-top: 2px solid #70e000;
    }

    .btn-more {
      background: linear-gradient(180deg, #ffb03a 0%, #f77f00 100%);
      border-top: 2px solid #ffd166;
    }
  </style>
</head>
<body>

  <div class="top-header">
    <button class="icon-btn">⚙️</button>
  </div>

  <div class="brand-box">
    <div class="crown-icon">👑</div>
    <div class="brand-title">GAME<br>HUB</div>
  </div>

  <div class="menu-list">
    <a href="tictactoe.html" class="menu-btn btn-ttt">
      <span>⭕</span> Tic Tac Toe (AI / 2P)
    </a>
    <a href="blockblast.html" class="menu-btn btn-bb">
      <span>🧱</span> Block Blast
    </a>
    <button class="menu-btn btn-more" onclick="alert('Nava levels ane games jaldi aavse!')">
      <span>🎮</span> More Games
    </button>
  </div>

</body>
</html>
