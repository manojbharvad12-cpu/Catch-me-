<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tic Tac Toe</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #719bb6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 16px 12px;
    }

    /* TOP HEADER BAR */
    .top-bar {
      width: 100%;
      max-width: 360px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-btn {
      background: #ffffff;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 4px 0 #567b93;
    }

    .nav-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #567b93;
    }

    .scoreboard {
      background: #ffffff;
      border-radius: 24px;
      display: flex;
      align-items: center;
      padding: 4px;
      box-shadow: 0 4px 0 #567b93;
      gap: 6px;
    }

    .score-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 18px;
    }

    .score-p1 {
      background: #e65c4f;
      color: #fff;
    }

    .score-p2 {
      background: #5c6b73;
      color: #fff;
    }

    .vs-tag {
      font-weight: 900;
      font-size: 13px;
      color: #1e293b;
      padding: 0 4px;
    }

    /* MODE SELECTOR */
    .mode-switch {
      display: flex;
      background: rgba(255, 255, 255, 0.4);
      padding: 4px;
      border-radius: 16px;
      gap: 6px;
      margin: 10px 0;
    }

    .mode-btn {
      border: none;
      background: transparent;
      padding: 8px 16px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 13px;
      color: #1e293b;
      cursor: pointer;
    }

    .mode-btn.active {
      background: #ffffff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.15);
    }

    /* TURN INDICATOR & AVATARS */
    .turn-bar {
      width: 100%;
      max-width: 340px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      margin-bottom: 10px;
    }

    .avatar-box {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: #4a5d6e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      box-shadow: 0 4px 0 #313e4a;
      transition: all 0.2s;
    }

    .avatar-box.turn-active {
      background: #ffffff;
      transform: scale(1.08);
      border: 3px solid #ff4d4d;
      box-shadow: 0 0 15px rgba(255, 77, 77, 0.6);
    }

    .avatar-box.turn-active.blue-turn {
      border-color: #2fb5ff;
      box-shadow: 0 0 15px rgba(47, 181, 255, 0.6);
    }

    .turn-arrow {
      font-size: 20px;
      color: #ffffff;
      font-weight: 900;
    }

    /* 3x3 GAME BOARD */
    .board-frame {
      width: 330px;
      height: 330px;
      background: #172b4d;
      border-radius: 24px;
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 10px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
    }

    .cell {
      background: #233b5d;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: background 0.15s, transform 0.1s;
    }

    .cell:active {
      transform: scale(0.96);
    }

    /* SVG NEON PIECES */
    .piece-x {
      width: 65px;
      height: 65px;
      stroke: #ff4d4d;
      stroke-width: 14;
      stroke-linecap: round;
      filter: drop-shadow(0 0 8px rgba(255, 77, 77, 0.7));
      animation: popPiece 0.18s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .piece-o {
      width: 60px;
      height: 60px;
      fill: none;
      stroke: #2fb5ff;
      stroke-width: 14;
      filter: drop-shadow(0 0 8px rgba(47, 181, 255, 0.7));
      animation: popPiece 0.18s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popPiece {
      0% { transform: scale(0.3); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .cell.winning {
      background: #204e79;
      box-shadow: inset 0 0 15px rgba(47, 181, 255, 0.8);
    }

    /* FOOTER */
    footer {
      font-size: 13px;
      color: #233b5d;
      font-weight: 800;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>

  <!-- TOP BAR -->
  <div class="top-bar">
    <button class="nav-btn" onclick="location.href='index.html'">❮</button>
    <div class="scoreboard">
      <div class="score-pill score-p1">
        <span>👤</span> <span id="scoreX">0</span>
      </div>
      <div class="vs-tag">VS</div>
      <div class="score-pill score-p2">
        <span id="p2Icon">🤖</span> <span id="scoreO">0</span>
      </div>
    </div>
    <button class="nav-btn" onclick="resetBoard()">🔄</button>
  </div>

  <!-- MODE SELECTOR -->
  <div class="mode-switch">
    <button class="mode-btn active" id="btnModeAI" onclick="setMode('ai')">VS Computer (AI)</button>
    <button class="mode-btn" id="btnModeLocal" onclick="setMode('local')">Local 2-Player</button>
  </div>

  <!-- TURN BAR -->
  <div class="turn-bar">
    <div class="avatar-box turn-active" id="avP1">👤</div>
    <div class="turn-arrow" id="turnArrow">◀</div>
    <div class="avatar-box" id="avP2">🤖</div>
  </div>

  <!-- 3x3 BOARD -->
  <div class="board-frame" id="board">
    <div class="cell" onclick="cellTapped(0)"></div>
    <div class="cell" onclick="cellTapped(1)"></div>
    <div class="cell" onclick="cellTapped(2)"></div>
    <div class="cell" onclick="cellTapped(3)"></div>
    <div class="cell" onclick="cellTapped(4)"></div>
    <div class="cell" onclick="cellTapped(5)"></div>
    <div class="cell" onclick="cellTapped(6)"></div>
    <div class="cell" onclick="cellTapped(7)"></div>
    <div class="cell" onclick="cellTapped(8)"></div>
  </div>

  <footer>❖ Tic Tac Toe ❖</footer>

  <script>
    let mode = 'ai'; // 'ai' athva 'local'
    let board = Array(9).fill(null);
    let currentTurn = 'X'; // 'X' or 'O'
    let isGameActive = true;
    let scores = { X: 0, O: 0 };

    const WIN_LINES = [
      [0,1,2],[3,4,5],[6,7,8],
      [0,3,6],[1,4,7],[2,5,8],
      [0,4,8],[2,4,6]
    ];

    const cells = document.querySelectorAll('.cell');
    const avP1 = document.getElementById('avP1');
    const avP2 = document.getElementById('avP2');
    const turnArrow = document.getElementById('turnArrow');
    const p2Icon = document.getElementById('p2Icon');

    function setMode(newMode) {
      mode = newMode;
      document.getElementById('btnModeAI').classList.toggle('active', mode === 'ai');
      document.getElementById('btnModeLocal').classList.toggle('active', mode === 'local');
      avP2.innerText = (mode === 'ai') ? '🤖' : '👥';
      p2Icon.innerText = (mode === 'ai') ? '🤖' : '👥';
      scores = { X: 0, O: 0 };
      updateScores();
      resetBoard();
    }

    function cellTapped(idx) {
      if (!isGameActive || board[idx] !== null) return;

      placeMark(idx, currentTurn);

      if (checkWin(currentTurn)) {
        scores[currentTurn]++;
        updateScores();
        isGameActive = false;
        setTimeout(resetBoard, 1200);
        return;
      }

      if (board.every(c => c !== null)) {
        isGameActive = false;
        setTimeout(resetBoard, 900);
        return;
      }

      // Turn Swap
      if (mode === 'local') {
        currentTurn = (currentTurn === 'X') ? 'O' : 'X';
        updateTurnUI();
      } else {
        currentTurn = 'O';
        updateTurnUI();
        isGameActive = false;
        setTimeout(playAITurn, 280);
      }
    }

    function placeMark(idx, sym) {
      board[idx] = sym;
      const cell = cells[idx];
      if (sym === 'X') {
        cell.innerHTML = `
          <svg class="piece-x" viewBox="0 0 100 100">
            <line x1="20" y1="20" x2="80" y2="80"/>
            <line x1="80" y1="20" x2="20" y2="80"/>
          </svg>`;
      } else {
        cell.innerHTML = `
          <svg class="piece-o" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="32"/>
          </svg>`;
      }
    }

    function playAITurn() {
      let move = scanWinningLine('O'); // Win priority
      if (move === null) move = scanWinningLine('X'); // 100% Guaranteed Block
      
      if (move === null) {
        if (board[4] === null) move = 4;
        else {
          const corners = [0, 2, 6, 8].filter(i => board[i] === null);
          const empties = [];
          board.forEach((v, i) => { if (v === null) empties.push(i); });
          move = corners.length > 0 ? corners[Math.floor(Math.random() * corners.length)] : empties[Math.floor(Math.random() * empties.length)];
        }
      }

      placeMark(move, 'O');

      if (checkWin('O')) {
        scores.O++;
        updateScores();
        isGameActive = false;
        setTimeout(resetBoard, 1200);
        return;
      }

      if (board.every(c => c !== null)) {
        isGameActive = false;
        setTimeout(resetBoard, 900);
        return;
      }

      currentTurn = 'X';
      updateTurnUI();
      isGameActive = true;
    }

    function scanWinningLine(sym) {
      for (let [a, b, c] of WIN_LINES) {
        const v = [board[a], board[b], board[c]];
        if (v.filter(x => x === sym).length === 2 && v.filter(x => x === null).length === 1) {
          if (board[a] === null) return a;
          if (board[b] === null) return b;
          if (board[c] === null) return c;
        }
      }
      return null;
    }

    function checkWin(sym) {
      for (let [a, b, c] of WIN_LINES) {
        if (board[a] === sym && board[b] === sym && board[c] === sym) {
          cells[a].classList.add('winning');
          cells[b].classList.add('winning');
          cells[c].classList.add('winning');
          return true;
        }
      }
      return false;
    }

    function updateTurnUI() {
      if (currentTurn === 'X') {
        avP1.className = 'avatar-box turn-active';
        avP2.className = 'avatar-box';
        turnArrow.innerText = '◀';
      } else {
        avP1.className = 'avatar-box';
        avP2.className = 'avatar-box turn-active blue-turn';
        turnArrow.innerText = '▶';
      }
    }

    function updateScores() {
      document.getElementById('scoreX').innerText = scores.X;
      document.getElementById('scoreO').innerText = scores.O;
    }

    function resetBoard() {
      board = Array(9).fill(null);
      cells.forEach(c => {
        c.innerHTML = '';
        c.className = 'cell';
      });
      currentTurn = 'X';
      updateTurnUI();
      isGameActive = true;
    }
  </script>
</body>
  </html>
