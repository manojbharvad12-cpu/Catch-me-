<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>More Settings</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: #1b5394;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .card-settings {
      width: 100%;
      max-width: 330px;
      background: #5077bf;
      border: 3px solid #7ea3e5;
      border-radius: 28px;
      padding: 24px 18px;
      position: relative;
      box-shadow: 0 16px 35px rgba(0,0,0,0.45);
      color: #fff;
    }

    .close-nav {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(0,0,0,0.25);
      border: none;
      color: #fff;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
    }

    .title {
      font-size: 24px;
      font-weight: 900;
      text-align: center;
      margin-bottom: 20px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }

    .app-info-box {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(0,0,0,0.15);
      padding: 12px 14px;
      border-radius: 16px;
      margin-bottom: 15px;
    }

    .app-icon {
      width: 48px;
      height: 48px;
      background: #2ec4b6;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    .app-name { font-size: 16px; font-weight: 800; }
    .app-ver { font-size: 12px; color: #cbd5e1; }

    .menu-item {
      background: rgba(255,255,255,0.12);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      cursor: pointer;
      font-weight: 700;
      font-size: 15px;
      transition: background 0.1s;
    }

    .menu-item:active { background: rgba(255,255,255,0.22); }

    .social-row {
      display: flex;
      gap: 10px;
      margin: 6px 0 14px 0;
      justify-content: space-around;
      background: rgba(0,0,0,0.15);
      padding: 10px;
      border-radius: 16px;
    }

    .social-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="card-settings">
    <button class="close-nav" onclick="location.href='blockblast.html'">✕</button>
    <div class="title">More Settings</div>

    <div class="app-info-box">
      <div class="app-icon">🧱</div>
      <div>
        <div class="app-name">Block Blast Master!</div>
        <div class="app-ver">Version: 1.0.0</div>
      </div>
    </div>

    <div class="menu-item" onclick="alert('Support Email: contact@blockblast.com')">
      <span>Contact Us</span>
      <span>›</span>
    </div>

    <div style="font-size:13px; font-weight:700; margin: 10px 0 4px 6px; color:#cbd5e1;">Share With Friends</div>
    <div class="social-row">
      <div class="social-icon">💬</div>
      <div class="social-icon">✈️</div>
      <div class="social-icon">🌐</div>
      <div class="social-icon">⭐</div>
    </div>

    <div class="menu-item" onclick="alert('Standard fair-play terms of service apply.')">
      <span>Terms of Service</span>
      <span>›</span>
    </div>

    <div class="menu-item" onclick="alert('Offline Game: No personal user data is stored on external servers.')">
      <span>Privacy Policy</span>
      <span>›</span>
    </div>

    <div class="menu-item" onclick="alert('Developed by Manoj Bharwad. Pure HTML5 & Offline Mobile Architecture.')">
      <span>About Us</span>
      <span>›</span>
    </div>
  </div>

</body>
</html>
