<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Block Blast Master Pro</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #b6885f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #gameCanvas {
      display: block;
      background: #b6885f;
    }

    .gameover-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .gameover-overlay.active { display: flex; }

    .gameover-card {
      width: 290px;
      background: #39424e;
      border: 3px solid #566375;
      border-radius: 22px;
      padding: 24px 18px;
      text-align: center;
      color: #fff;
      box-shadow: 0 16px 35px rgba(0,0,0,0.6);
    }

    .gameover-title {
      font-size: 26px;
      font-weight: 900;
      color: #ff4d6d;
      margin-bottom: 6px;
    }

    .gameover-score {
      font-size: 42px;
      font-weight: 900;
      color: #ffd166;
      margin: 12px 0 20px 0;
    }

    .btn-retry {
      width: 100%;
      height: 52px;
      background: linear-gradient(180deg, #22c55e 0%, #15803d 100%);
      border: 2px solid #86efac;
      border-radius: 18px;
      color: #fff;
      font-size: 20px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 6px 0 #14532d;
    }

    .btn-retry:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0 #14532d;
    }
  </style>
</head>
<body>

  <canvas id="gameCanvas"></canvas>

  <div class="gameover-overlay" id="gameOverModal">
    <div class="gameover-card">
      <div class="gameover-title">NO SPACE LEFT!</div>
      <div style="font-size: 13px; color: #94a3b8; font-weight: 700;">FINAL SCORE</div>
      <div class="gameover-score" id="resScore">0</div>
      <button class="btn-retry" onclick="restartGame()">Play Again</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const V_WIDTH = 380;
    const V_HEIGHT = 740;
    let scale = 1;

    function resize() {
      const w = window.innerWidth || 380;
      const h = window.innerHeight || 740;
      scale = Math.min(w / V_WIDTH, h / V_HEIGHT);
      if (scale <= 0) scale = 1;
      canvas.width = Math.floor(V_WIDTH * scale);
      canvas.height = Math.floor(V_HEIGHT * scale);
    }
    window.addEventListener('resize', resize);
    resize();

    // AUDIO
    let audioCtx = null;
    function playBeep(freq, dur = 0.08) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.frequency.value = freq;
        g.gain.setValueAtTime(0.12, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch(e){}
    }

    // BOARD CONSTANTS (Exact Wood Theme matching photos)
    const B_LEFT = 24;
    const B_TOP = 145;
    const B_SIZE = 332;
    const CELL_SIZE = (B_SIZE - 18) / 8;

    let grid = Array(8).fill(null).map(() => Array(8).fill(0));
    let score = 0; // Starts from 0
    let targetScore = 0;
    let highScore = parseInt(localStorage.getItem('bb_master_high')) || 239422;
    let combo = 0;
    let particles = [];
    let popups = [];

    // EXACT WOOD BLOCK PALETTE FROM YOUR PHOTOS
    const WOOD = {
      base: '#cf6e3e',
      top: '#f39b6b',
      bottom: '#8d3b15'
    };

    // EXACT SHAPES EXTRACTED FROM YOUR 8 PHOTOS
    const EXACT_PHOTO_SHAPES = [
      // 1. Bars (4-line, 5-line)
      { m: [[1,1,1,1]], w:4, h:1 },
      { m: [[1],[1],[1],[1]], w:1, h:4 },
      { m: [[1,1,1,1,1]], w:5, h:1 },
      { m: [[1],[1],[1],[1],[1]], w:1, h:5 },

      // 2. Squares & Rectangles (2x2, 2x3, 3x2, 3x3)
      { m: [[1,1],[1,1]], w:2, h:2 },
      { m: [[1,1,1],[1,1,1]], w:3, h:2 },
      { m: [[1,1],[1,1],[1,1]], w:2, h:3 },
      { m: [[1,1,1],[1,1,1],[1,1,1]], w:3, h:3 },

      // 3. Small Corners (2x2)
      { m: [[1,0],[1,1]], w:2, h:2 },
      { m: [[0,1],[1,1]], w:2, h:2 },
      { m: [[1,1],[1,0]], w:2, h:2 },
      { m: [[1,1],[0,1]], w:2, h:2 },

      // 4. Big Corners (3x3 - 5 blocks)
      { m: [[1,0,0],[1,0,0],[1,1,1]], w:3, h:3 },
      { m: [[0,0,1],[0,0,1],[1,1,1]], w:3, h:3 },
      { m: [[1,1,1],[1,0,0],[1,0,0]], w:3, h:3 },
      { m: [[1,1,1],[0,0,1],[0,0,1]], w:3, h:3 },

      // 5. T-Shapes (3x2, 2x3)
      { m: [[1,1,1],[0,1,0]], w:3, h:2 },
      { m: [[0,1,0],[1,1,1]], w:3, h:2 },
      { m: [[1,0],[1,1],[1,0]], w:2, h:3 },
      { m: [[0,1],[1,1],[0,1]], w:2, h:3 },

      // 6. Z & S Shapes
      { m: [[1,1,0],[0,1,1]], w:3, h:2 },
      { m: [[0,1,1],[1,1,0]], w:3, h:2 },
      { m: [[0,1],[1,1],[1,0]], w:2, h:3 },
      { m: [[1,0],[1,1],[0,1]], w:2, h:3 }
    ];

    let dock = [null, null, null];
    let dragging = null;

    function spawnDock() {
      for (let i = 0; i < 3; i++) {
        dock[i] = EXACT_PHOTO_SHAPES[Math.floor(Math.random() * EXACT_PHOTO_SHAPES.length)];
      }
      checkGameOver();
    }

    function checkGameOver() {
      const remaining = dock.filter(s => s !== null);
      if (remaining.length === 0) return;

      let canPlaceAny = false;
      for (let shape of remaining) {
        for (let r = 0; r <= 8 - shape.h; r++) {
          for (let c = 0; c <= 8 - shape.w; c++) {
            if (canFit(shape.m, r, c)) {
              canPlaceAny = true;
              break;
            }
          }
          if (canPlaceAny) break;
        }
        if (canPlaceAny) break;
      }

      if (!canPlaceAny) {
        if (score > highScore) {
          highScore = score;
          localStorage.setItem('bb_master_high', highScore);
        }
        document.getElementById('resScore').innerText = score.toLocaleString();
        document.getElementById('gameOverModal').classList.add('active');
      }
    }

    function restartGame() {
      document.getElementById('gameOverModal').classList.remove('active');
      grid = Array(8).fill(null).map(() => Array(8).fill(0));
      score = 0;
      targetScore = 0;
      combo = 0;
      spawnDock();
    }

    // DRAW BLOCK (Terracotta Wood Bevel)
    function drawBlock(x, y, size, alpha = 1) {
      ctx.save();
      ctx.globalAlpha = alpha;

      ctx.fillStyle = WOOD.base;
      ctx.fillRect(x, y, size, size);

      ctx.fillStyle = WOOD.top;
      ctx.fillRect(x, y, size, 4);
      ctx.fillRect(x, y, 4, size);

      ctx.fillStyle = WOOD.bottom;
      ctx.fillRect(x, y + size - 4, size, 4);
      ctx.fillRect(x + size - 4, y, 4, size);

      ctx.fillStyle = 'rgba(255, 255, 255, 0.22)';
      ctx.fillRect(x + 5, y + 5, size - 10, size - 10);

      ctx.restore();
    }

    // MAIN 60FPS LOOP
    let diamondRot = 0;
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.save();
      ctx.scale(scale, scale);

      if (score < targetScore) {
        score += Math.ceil((targetScore - score) * 0.15);
      }

      // 1. TOP STATS
      ctx.fillStyle = '#ffd166';
      ctx.font = '900 20px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('👑 ' + highScore.toLocaleString(), 24, 42);

      ctx.fillStyle = '#ffffff';
      ctx.font = '22px sans-serif';
      ctx.fillText('⚙️', 332, 42);

      // 2. ROTATING DIAMOND
      diamondRot += 0.02;
      const scoreX = 190;
      const scoreY = 92;

      ctx.save();
      ctx.translate(scoreX, scoreY);
      ctx.rotate(diamondRot);
      const diaGrad = ctx.createLinearGradient(-26, -26, 26, 26);
      diaGrad.addColorStop(0, '#f72585');
      diaGrad.addColorStop(0.5, '#7209b7');
      diaGrad.addColorStop(1, '#4cc9f0');
      ctx.fillStyle = diaGrad;
      ctx.fillRect(-20, -20, 40, 40);
      ctx.restore();

      // 3. SCORE DISPLAY
      const rainbowGrad = ctx.createLinearGradient(110, 0, 270, 0);
      rainbowGrad.addColorStop(0, '#4cc9f0');
      rainbowGrad.addColorStop(0.3, '#72efdd');
      rainbowGrad.addColorStop(0.6, '#ffd166');
      rainbowGrad.addColorStop(1, '#ff4d6d');

      ctx.fillStyle = rainbowGrad;
      ctx.font = '900 52px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(score, scoreX, 110);

      // 4. BOARD
      ctx.fillStyle = '#402416';
      ctx.fillRect(B_LEFT, B_TOP, B_SIZE, B_SIZE);

      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const cx = B_LEFT + 9 + c * (CELL_SIZE + 2);
          const cy = B_TOP + 9 + r * (CELL_SIZE + 2);
          ctx.fillStyle = '#2b170c';
          ctx.fillRect(cx, cy, CELL_SIZE, CELL_SIZE);

          if (grid[r][c] === 1) {
            drawBlock(cx, cy, CELL_SIZE);
          }
        }
      }

      // 5. HOVER PREVIEW
      if (dragging) {
        const coords = getGridCoords(dragging.x, dragging.y - 70, dragging.shape);
        if (coords && canFit(dragging.shape.m, coords.r, coords.c)) {
          for (let r = 0; r < dragging.shape.h; r++) {
            for (let c = 0; c < dragging.shape.w; c++) {
              if (dragging.shape.m[r][c]) {
                const px = B_LEFT + 9 + (coords.c + c) * (CELL_SIZE + 2);
                const py = B_TOP + 9 + (coords.r + r) * (CELL_SIZE + 2);
                drawBlock(px, py, CELL_SIZE, 0.45);
              }
            }
          }
        }
      }

      // 6. BOTTOM DOCK (Photo Alignment)
      const dockY = 560;
      const slotCenters = [75, 190, 305];
      for (let i = 0; i < 3; i++) {
        const shape = dock[i];
        if (shape && (!dragging || dragging.idx !== i)) {
          const uSize = 18;
          const startX = slotCenters[i] - (shape.w * uSize) / 2;
          const startY = dockY - (shape.h * uSize) / 2;

          for (let r = 0; r < shape.h; r++) {
            for (let c = 0; c < shape.w; c++) {
              if (shape.m[r][c]) {
                drawBlock(startX + c * uSize, startY + r * uSize, uSize);
              }
            }
          }
        }
      }

      // 7. DRAGGING PIECE
      if (dragging) {
        const uSize = CELL_SIZE;
        const dragX = dragging.x - (dragging.shape.w * uSize) / 2;
        const dragY = (dragging.y - 70) - (dragging.shape.h * uSize) / 2;

        for (let r = 0; r < dragging.shape.h; r++) {
          for (let c = 0; c < dragging.shape.w; c++) {
            if (dragging.shape.m[r][c]) {
              drawBlock(dragX + c * (uSize + 2), dragY + r * (uSize + 2), uSize, 0.95);
            }
          }
        }
      }

      // 8. PARTICLES
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.alpha;
        ctx.fillRect(p.x, p.y, p.size, p.size);
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.035;
        if (p.alpha <= 0) particles.splice(i, 1);
      }
      ctx.globalAlpha = 1;

      // 9. POPUPS
      for (let i = popups.length - 1; i >= 0; i--) {
        const pop = popups[i];
        ctx.save();
        ctx.fillStyle = pop.color;
        ctx.font = `900 ${pop.size}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText(pop.text, pop.x, pop.y);
        ctx.restore();

        pop.y -= 1.2;
        pop.life--;
        if (pop.life <= 0) popups.splice(i, 1);
      }

      ctx.restore();
      requestAnimationFrame(draw);
    }

    // TOUCH HANDLERS
    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (cx - rect.left) / scale,
        y: (cy - rect.top) / scale
      };
    }

    window.addEventListener('pointerdown', (e) => {
      const { x, y } = getPos(e);
      const slotCenters = [75, 190, 305];
      const dockY = 560;

      for (let i = 0; i < 3; i++) {
        if (dock[i]) {
          const d = Math.hypot(x - slotCenters[i], y - dockY);
          if (d < 50) {
            dragging = { idx: i, shape: dock[i], x: x, y: y };
            playBeep(450);
            break;
          }
        }
      }
    });

    window.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const { x, y } = getPos(e);
      dragging.x = x;
      dragging.y = y;
    });

    window.addEventListener('pointerup', () => {
      if (!dragging) return;
      const targetY = dragging.y - 70;
      const coords = getGridCoords(dragging.x, targetY, dragging.shape);

      if (coords && canFit(dragging.shape.m, coords.r, coords.c)) {
        let placedCount = 0;
        for (let r = 0; r < dragging.shape.h; r++) {
          for (let c = 0; c < dragging.shape.w; c++) {
            if (dragging.shape.m[r][c]) {
              grid[coords.r + r][coords.c + c] = 1;
              placedCount++;
            }
          }
        }

        dock[dragging.idx] = null;
        targetScore += placedCount * 10;
        playBeep(320);

        if (targetScore > highScore) {
          highScore = targetScore;
          localStorage.setItem('bb_master_high', highScore);
        }

        checkLineClears();

        if (dock.every(s => s === null)) {
          spawnDock();
        } else {
          checkGameOver();
        }
      }

      dragging = null;
    });

    function getGridCoords(x, y, shape) {
      const cellW = CELL_SIZE + 2;
      const startX = B_LEFT + 9;
      const startY = B_TOP + 9;

      const tlX = x - (shape.w * cellW) / 2;
      const tlY = y - (shape.h * cellW) / 2;

      const c = Math.round((tlX - startX) / cellW);
      const r = Math.round((tlY - startY) / cellW);

      return { r, c };
    }

    function canFit(m, r, c) {
      if (r < 0 || c < 0 || r + m.length > 8 || c + m[0].length > 8) return false;
      for (let i = 0; i < m.length; i++) {
        for (let j = 0; j < m[0].length; j++) {
          if (m[i][j] && grid[r + i][c + j] === 1) return false;
        }
      }
      return true;
    }

    function checkLineClears() {
      let rClears = [];
      let cClears = [];

      for (let r = 0; r < 8; r++) if (grid[r].every(v => v === 1)) rClears.push(r);
      for (let c = 0; c < 8; c++) {
        let full = true;
        for (let r = 0; r < 8; r++) if (grid[r][c] === 0) { full = false; break; }
        if (full) cClears.push(c);
      }

      const totalLines = rClears.length + cClears.length;

      if (totalLines > 0) {
        combo++;
        const pts = totalLines * 120 + (combo > 1 ? combo * 100 : 0);
        targetScore += pts;

        popups.push({
          x: 190, y: 150,
          text: `+${pts}`,
          color: '#ffd166',
          size: 30, life: 35
        });

        if (combo > 1) {
          popups.push({
            x: 190, y: 220,
            text: `Combo ${combo}!`,
            color: '#facc15',
            size: 34, life: 45
          });
        }

        rClears.forEach(r => {
          grid[r].fill(0);
          for (let c = 0; c < 8; c++) spawnParticles(r, c);
        });
        cClears.forEach(c => {
          for (let r = 0; r < 8; r++) {
            grid[r][c] = 0;
            spawnParticles(r, c);
          }
        });

        playBeep(650, 0.25);
      } else {
        combo = 0;
      }
    }

    function spawnParticles(r, c) {
      const cx = B_LEFT + 9 + c * (CELL_SIZE + 2) + CELL_SIZE / 2;
      const cy = B_TOP + 9 + r * (CELL_SIZE + 2) + CELL_SIZE / 2;
      for (let i = 0; i < 6; i++) {
        particles.push({
          x: cx, y: cy,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          size: Math.random() * 4 + 3,
          color: '#facc15',
          alpha: 1
        });
      }
    }

    window.onload = () => {
      resize();
      spawnDock();
      requestAnimationFrame(draw);
    };
  </script>
</body>
</html>
