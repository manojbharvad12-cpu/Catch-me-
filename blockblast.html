<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Block Blast Master</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #b78860;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #gameCanvas {
      background: #b78860;
      display: block;
    }

    /* MASSIVE CLEAR / GAME OVER SCREEN */
    .result-screen {
      display: none;
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg, #1257c2 0%, #082d6b 100%);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
      color: #fff;
    }

    .result-screen.active { display: flex; }

    .result-title {
      font-size: 38px;
      font-weight: 900;
      background: linear-gradient(180deg, #ff9cf0 0%, #ffffff 50%, #70e0ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
      margin-bottom: 30px;
      text-align: center;
    }

    .score-card {
      text-align: center;
      margin-bottom: 25px;
    }

    .score-lbl {
      font-size: 14px;
      font-weight: 800;
      color: #93c5fd;
      letter-spacing: 1px;
    }

    .score-val {
      font-size: 48px;
      font-weight: 900;
      color: #ffffff;
      margin-top: 2px;
      text-shadow: 0 4px 12px rgba(0,0,0,0.4);
    }

    .best-val {
      font-size: 28px;
      font-weight: 900;
      color: #ffd166;
      margin-top: 2px;
    }

    .btn-play-again {
      width: 220px;
      height: 60px;
      background: linear-gradient(180deg, #22c55e 0%, #15803d 100%);
      border: 3px solid #86efac;
      border-radius: 30px;
      color: #fff;
      font-size: 22px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 8px 0 #14532d, 0 12px 25px rgba(0,0,0,0.5);
      cursor: pointer;
      margin-top: 20px;
    }

    .btn-play-again:active {
      transform: translateY(4px);
      box-shadow: 0 4px 0 #14532d;
    }
  </style>
</head>
<body>

  <canvas id="gameCanvas"></canvas>

  <!-- RESULT SCREEN (Original Video Style) -->
  <div class="result-screen" id="resultScreen">
    <div class="result-title">Massive Clear</div>

    <div class="score-card">
      <div class="score-lbl">Score</div>
      <div class="score-val" id="resCurScore">0</div>
    </div>

    <div class="score-card">
      <div class="score-lbl">Best Score</div>
      <div class="best-val" id="resBestScore">0</div>
    </div>

    <button class="btn-play-again" onclick="restartGame()">
      <span>▶</span> Great!
    </button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const VIEW_W = 380;
    const VIEW_H = 760;
    let scale = 1;

    function resize() {
      scale = Math.min(window.innerWidth / VIEW_W, window.innerHeight / VIEW_H);
      canvas.width = VIEW_W * scale;
      canvas.height = VIEW_H * scale;
    }
    window.addEventListener('resize', resize);
    resize();

    // AUDIO
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, dur = 0.08) {
      try {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.frequency.value = freq;
        g.gain.setValueAtTime(0.12, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch(e){}
    }

    // BOARD CONFIG (Wood Theme matching Video)
    const BOARD_LEFT = 24;
    const BOARD_TOP = 155;
    const BOARD_SIZE = 332;
    const CELL_SIZE = (BOARD_SIZE - 18) / 8;

    let grid = Array(8).fill(null).map(() => Array(8).fill(0));
    let score = 0;
    let targetScore = 0;
    let highScore = parseInt(localStorage.getItem('bb_master_high')) || 239422;
    let combo = 0;
    let particles = [];
    let popups = [];
    let boardFlash = 0;

    // WOOD BLOCK COLORS (From Video)
    const WOOD_COLOR = {
      base: '#dfba6f',
      top: '#f9e7a8',
      bottom: '#a37c35',
      shadow: '#6a4e21'
    };

    // ORIGINAL BLOCK BLAST SHAPES (Balanced - No 1x1 spam)
    const REAL_SHAPES = [
      // 1. Bars
      { m: [[1,1,1]], w:3, h:1 },
      { m: [[1],[1],[1]], w:1, h:3 },
      { m: [[1,1,1,1]], w:4, h:1 },
      { m: [[1],[1],[1],[1]], w:1, h:4 },
      { m: [[1,1,1,1,1]], w:5, h:1 },
      
      // 2. Squares
      { m: [[1,1],[1,1]], w:2, h:2 },
      { m: [[1,1,1],[1,1,1],[1,1,1]], w:3, h:3 },
      
      // 3. Corners & L-Shapes
      { m: [[1,0],[1,1]], w:2, h:2 },
      { m: [[0,1],[1,1]], w:2, h:2 },
      { m: [[1,1],[1,0]], w:2, h:2 },
      { m: [[1,1],[0,1]], w:2, h:2 },
      { m: [[1,0,0],[1,0,0],[1,1,1]], w:3, h:3 },
      { m: [[0,0,1],[0,0,1],[1,1,1]], w:3, h:3 },
      { m: [[1,1,1],[1,0,0],[1,0,0]], w:3, h:3 },
      
      // 4. T-Shapes & Z-Shapes
      { m: [[1,1,1],[0,1,0]], w:3, h:2 },
      { m: [[0,1,0],[1,1,1]], w:3, h:2 },
      { m: [[1,1,0],[0,1,1]], w:3, h:2 },
      
      // 5. Small dominoes (rare)
      { m: [[1,1]], w:2, h:1 },
      { m: [[1],[1]], w:1, h:2 }
    ];

    let dock = [null, null, null];
    let dragging = null;

    // PROFESSIONAL SPAWN CONTROLLER (Addiction & Fair Logic)
    function spawnBalancedDock() {
      // Shuruat ma grid ma thoda random wood blocks muki devay (like original game)
      for(let i=0; i<3; i++) {
        // Pure balanced shapes
        const rand = REAL_SHAPES[Math.floor(Math.random() * REAL_SHAPES.length)];
        dock[i] = rand;
      }

      checkGameOver();
    }

    function checkGameOver() {
      const remaining = dock.filter(s => s !== null);
      if(remaining.length === 0) return;

      let canPlaceAny = false;
      for(let shape of remaining) {
        for(let r=0; r<=8-shape.h; r++) {
          for(let c=0; c<=8-shape.w; c++) {
            if(canFit(shape.m, r, c)) {
              canPlaceAny = true;
              break;
            }
          }
          if(canPlaceAny) break;
        }
        if(canPlaceAny) break;
      }

      if(!canPlaceAny) {
        if(score > highScore) {
          highScore = score;
          localStorage.setItem('bb_master_high', highScore);
        }

        setTimeout(() => {
          document.getElementById('resCurScore').innerText = score.toLocaleString();
          document.getElementById('resBestScore').innerText = highScore.toLocaleString();
          document.getElementById('resultScreen').classList.add('active');
        }, 500);
      }
    }

    function restartGame() {
      document.getElementById('resultScreen').classList.remove('active');
      grid = Array(8).fill(null).map(() => Array(8).fill(0));
      score = 0;
      targetScore = 0;
      combo = 0;
      spawnBalancedDock();
    }

    // DRAW WOOD 3D BEVEL BLOCK
    function drawWoodBlock(x, y, size, alpha = 1) {
      ctx.save();
      ctx.globalAlpha = alpha;

      // Base
      ctx.fillStyle = WOOD_COLOR.base;
      ctx.beginPath();
      ctx.roundRect(x, y, size, size, 4);
      ctx.fill();

      // Top Highlight Bevel
      ctx.fillStyle = WOOD_COLOR.top;
      ctx.beginPath();
      ctx.moveTo(x, y); ctx.lineTo(x + size, y);
      ctx.lineTo(x + size - 4, y + 4); ctx.lineTo(x + 4, y + 4);
      ctx.closePath(); ctx.fill();

      ctx.beginPath();
      ctx.moveTo(x, y); ctx.lineTo(x + 4, y + 4);
      ctx.lineTo(x + 4, y + size - 4); ctx.lineTo(x, y + size);
      ctx.closePath(); ctx.fill();

      // Bottom Dark Shadow Bevel
      ctx.fillStyle = WOOD_COLOR.bottom;
      ctx.beginPath();
      ctx.moveTo(x, y + size); ctx.lineTo(x + 4, y + size - 4);
      ctx.lineTo(x + size - 4, y + size - 4); ctx.lineTo(x + size, y + size);
      ctx.closePath(); ctx.fill();

      ctx.beginPath();
      ctx.moveTo(x + size, y); ctx.lineTo(x + size, y + size);
      ctx.lineTo(x + size - 4, y + size - 4); ctx.lineTo(x + size - 4, y + 4);
      ctx.closePath(); ctx.fill();

      // Center glossy inner inset
      ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
      ctx.fillRect(x + 5, y + 5, size - 10, size - 10);

      ctx.restore();
    }

    // MAIN 60FPS ENGINE
    let diamondRot = 0;
    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.save();
      ctx.scale(scale, scale);

      // Smooth Rolling Score Animation
      if(score < targetScore) {
        score += Math.ceil((targetScore - score) * 0.15);
      }

      // 1. HEADER
      ctx.fillStyle = '#ffd166';
      ctx.font = '900 20px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('👑 ' + highScore.toLocaleString(), 24, 46);

      ctx.fillStyle = '#ffffff';
      ctx.font = '22px sans-serif';
      ctx.fillText('⚙️', 332, 46);

      // 2. ROTATING RAINBOW DIAMOND
      diamondRot += 0.02;
      const scoreX = 190;
      const scoreY = 96;

      ctx.save();
      ctx.translate(scoreX, scoreY);
      ctx.rotate(diamondRot);
      const diaGrad = ctx.createLinearGradient(-26, -26, 26, 26);
      diaGrad.addColorStop(0, '#f72585');
      diaGrad.addColorStop(0.5, '#7209b7');
      diaGrad.addColorStop(1, '#4cc9f0');
      ctx.fillStyle = diaGrad;
      ctx.fillRect(-20, -20, 40, 40);
      ctx.restore();

      // 3. SCORE DISPLAY
      const rainbowGrad = ctx.createLinearGradient(110, 0, 270, 0);
      rainbowGrad.addColorStop(0, '#4cc9f0');
      rainbowGrad.addColorStop(0.3, '#72efdd');
      rainbowGrad.addColorStop(0.6, '#ffd166');
      rainbowGrad.addColorStop(1, '#ff4d6d');

      ctx.fillStyle = rainbowGrad;
      ctx.font = '900 52px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(score, scoreX, 114);

      // 4. BOARD FRAME (Wood Board)
      ctx.fillStyle = '#5c3d24';
      ctx.beginPath();
      ctx.roundRect(BOARD_LEFT, BOARD_TOP, BOARD_SIZE, BOARD_SIZE, 12);
      ctx.fill();

      // Grid Cells
      for(let r=0; r<8; r++) {
        for(let c=0; c<8; c++) {
          const cx = BOARD_LEFT + 9 + c * (CELL_SIZE + 2);
          const cy = BOARD_TOP + 9 + r * (CELL_SIZE + 2);
          ctx.fillStyle = '#422a17';
          ctx.beginPath();
          ctx.roundRect(cx, cy, CELL_SIZE, CELL_SIZE, 4);
          ctx.fill();

          if(grid[r][c] === 1) {
            drawWoodBlock(cx, cy, CELL_SIZE);
          }
        }
      }

      // Board Wipe Flash Effect (When entire board is cleared!)
      if(boardFlash > 0) {
        ctx.fillStyle = `rgba(255, 255, 255, ${boardFlash})`;
        ctx.fillRect(BOARD_LEFT, BOARD_TOP, BOARD_SIZE, BOARD_SIZE);
        boardFlash -= 0.05;
      }

      // 5. HOVER PREVIEW
      if(dragging) {
        const coords = getGridCoords(dragging.x, dragging.y - 70, dragging.shape);
        if(coords && canFit(dragging.shape.m, coords.r, coords.c)) {
          for(let r=0; r<dragging.shape.h; r++) {
            for(let c=0; c<dragging.shape.w; c++) {
              if(dragging.shape.m[r][c]) {
                const px = BOARD_LEFT + 9 + (coords.c + c) * (CELL_SIZE + 2);
                const py = BOARD_TOP + 9 + (coords.r + r) * (CELL_SIZE + 2);
                drawWoodBlock(px, py, CELL_SIZE, 0.45);
              }
            }
          }
        }
      }

      // 6. BOTTOM DOCK PIECES
      const dockY = 560;
      const slotCenters = [75, 190, 305];
      for(let i=0; i<3; i++) {
        const shape = dock[i];
        if(shape && (!dragging || dragging.idx !== i)) {
          const uSize = 20;
          const startX = slotCenters[i] - (shape.w * uSize) / 2;
          const startY = dockY - (shape.h * uSize) / 2;

          for(let r=0; r<shape.h; r++) {
            for(let c=0; c<shape.w; c++) {
              if(shape.m[r][c]) {
                drawWoodBlock(startX + c * uSize, startY + r * uSize, uSize);
              }
            }
          }
        }
      }

      // 7. DRAGGING PIECE (Under Finger)
      if(dragging) {
        const uSize = CELL_SIZE;
        const dragX = dragging.x - (dragging.shape.w * uSize) / 2;
        const dragY = (dragging.y - 70) - (dragging.shape.h * uSize) / 2;

        for(let r=0; r<dragging.shape.h; r++) {
          for(let c=0; c<dragging.shape.w; c++) {
            if(dragging.shape.m[r][c]) {
              drawWoodBlock(dragX + c * (uSize + 2), dragY + r * (uSize + 2), uSize, 0.95);
            }
          }
        }
      }

      // 8. BURST PARTICLES
      for(let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.alpha;
        ctx.fillRect(p.x, p.y, p.size, p.size);
        p.x += p.vx; p.y += p.vy;
        p.alpha -= 0.035;
        if(p.alpha <= 0) particles.splice(i, 1);
      }
      ctx.globalAlpha = 1;

      // 9. COMBO & SCORE POPUPS (+1380 / Combo Master)
      for(let i = popups.length - 1; i >= 0; i--) {
        const pop = popups[i];
        ctx.save();
        ctx.fillStyle = pop.color;
        ctx.font = `900 ${pop.size}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.shadowColor = 'rgba(0,0,0,0.6)';
        ctx.shadowBlur = 8;
        ctx.fillText(pop.text, pop.x, pop.y);
        ctx.restore();

        pop.y -= 1.2;
        pop.life--;
        if(pop.life <= 0) popups.splice(i, 1);
      }

      ctx.restore();
      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);

    // TOUCH HANDLERS
    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (cx - rect.left) / scale,
        y: (cy - rect.top) / scale
      };
    }

    window.addEventListener('pointerdown', (e) => {
      const { x, y } = getPos(e);
      const slotCenters = [75, 190, 305];
      const dockY = 560;

      for(let i=0; i<3; i++) {
        if(dock[i]) {
          const d = Math.hypot(x - slotCenters[i], y - dockY);
          if(d < 55) {
            dragging = { idx: i, shape: dock[i], x: x, y: y };
            playBeep(450);
            break;
          }
        }
      }
    });

    window.addEventListener('pointermove', (e) => {
      if(!dragging) return;
      const { x, y } = getPos(e);
      dragging.x = x;
      dragging.y = y;
    });

    window.addEventListener('pointerup', () => {
      if(!dragging) return;
      const targetY = dragging.y - 70;
      const coords = getGridCoords(dragging.x, targetY, dragging.shape);

      if(coords && canFit(dragging.shape.m, coords.r, coords.c)) {
        let placedCount = 0;
        for(let r=0; r<dragging.shape.h; r++) {
          for(let c=0; c<dragging.shape.w; c++) {
            if(dragging.shape.m[r][c]) {
              grid[coords.r + r][coords.c + c] = 1;
              placedCount++;
            }
          }
        }

        dock[dragging.idx] = null;
        targetScore += placedCount * 10;
        playBeep(320);

        checkLineClears();

        if(dock.every(s => s === null)) {
          spawnBalancedDock();
        } else {
          checkGameOver();
        }
      }

      dragging = null;
    });

    function getGridCoords(x, y, shape) {
      const cellW = CELL_SIZE + 2;
      const startX = BOARD_LEFT + 9;
      const startY = BOARD_TOP + 9;

      const tlX = x - (shape.w * cellW) / 2;
      const tlY = y - (shape.h * cellW) / 2;

      const c = Math.round((tlX - startX) / cellW);
      const r = Math.round((tlY - startY) / cellW);

      return { r, c };
    }

    function canFit(m, r, c) {
      if(r < 0 || c < 0 || r + m.length > 8 || c + m[0].length > 8) return false;
      for(let i=0; i<m.length; i++) {
        for(let j=0; j<m[0].length; j++) {
          if(m[i][j] && grid[r+i][c+j] === 1) return false;
        }
      }
      return true;
    }

    // LINE CLEARS & MASSIVE BOARD WIPE DETECTION
    function checkLineClears() {
      let rClears = [];
      let cClears = [];

      for(let r=0; r<8; r++) if(grid[r].every(v => v === 1)) rClears.push(r);
      for(let c=0; c<8; c++) {
        let full = true;
        for(let r=0; r<8; r++) if(grid[r][c] === 0) { full = false; break; }
        if(full) cClears.push(c);
      }

      const totalLines = rClears.length + cClears.length;

      if(totalLines > 0) {
        combo++;
        const linePoints = totalLines * 120 + (combo > 1 ? combo * 100 : 0);
        targetScore += linePoints;

        if(targetScore > highScore) {
          highScore = targetScore;
          localStorage.setItem('bb_master_high', highScore);
        }

        // Popup line points
        popups.push({
          x: 190, y: 150,
          text: `+${linePoints}`,
          color: '#ffd166',
          size: 30, life: 40
        });

        // Combo Title
        if(combo > 1) {
          popups.push({
            x: 190, y: 310,
            text: `Combo Master x${combo}!`,
            color: '#facc15',
            size: 32, life: 50
          });
        }

        rClears.forEach(r => {
          grid[r].fill(0);
          for(let c=0; c<8; c++) spawnParticles(r, c);
        });
        cClears.forEach(c => {
          for(let r=0; r<8; r++) {
            grid[r][c] = 0;
            spawnParticles(r, c);
          }
        });

        // MASSIVE BOARD WIPE CHECK (Jo Aakho Board Ek sathe Khali Thai Jaay)
        const isBoardEmpty = grid.every(row => row.every(val => val === 0));
        if(isBoardEmpty) {
          boardFlash = 1.0; // Screen flash
          targetScore += 1000;
          popups.push({
            x: 190, y: 250,
            text: 'MASSIVE CLEAR! +1000',
            color: '#38bdf8',
            size: 32, life: 70
          });
        }

        playBeep(650, 0.25);
      } else {
        combo = 0;
      }
    }

    function spawnParticles(r, c) {
      const cx = BOARD_LEFT + 9 + c * (CELL_SIZE + 2) + CELL_SIZE/2;
      const cy = BOARD_TOP + 9 + r * (CELL_SIZE + 2) + CELL_SIZE/2;
      for(let i=0; i<6; i++) {
        particles.push({
          x: cx, y: cy,
          vx: (Math.random() - 0.5) * 7,
          vy: (Math.random() - 0.5) * 7,
          size: Math.random() * 4 + 3,
          color: Math.random() < 0.5 ? '#facc15' : '#e2e8f0',
          alpha: 1
        });
      }
    }

    // INIT
    spawnBalancedDock();
  </script>
</body>
</html>
