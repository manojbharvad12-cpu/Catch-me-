<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Block Blast Master</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #2b3035;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #gameCanvas {
      background: #2b3035;
      display: block;
    }

    /* GAME OVER POPUP */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(5px);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal-overlay.active { display: flex; }

    .gameover-box {
      width: 300px;
      background: #39424e;
      border: 3px solid #566375;
      border-radius: 26px;
      padding: 26px 20px;
      text-align: center;
      color: #fff;
      box-shadow: 0 16px 35px rgba(0,0,0,0.6);
      animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { transform: scale(0.6); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .gameover-tag {
      font-size: 26px;
      font-weight: 900;
      color: #ff4d6d;
      text-shadow: 0 2px 8px rgba(255, 77, 109, 0.4);
      margin-bottom: 6px;
    }

    .gameover-sub {
      font-size: 14px;
      color: #94a3b8;
      font-weight: 700;
      margin-bottom: 18px;
    }

    .score-res-box {
      background: #272d35;
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 22px;
    }

    .score-res-val {
      font-size: 40px;
      font-weight: 900;
      color: #ffd166;
    }

    .btn-retry {
      width: 100%;
      height: 52px;
      background: linear-gradient(180deg, #06d6a0 0%, #049f76 100%);
      border: 2px solid #70e000;
      border-radius: 18px;
      font-size: 18px;
      font-weight: 900;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 6px 0 #02644a, 0 10px 18px rgba(0,0,0,0.3);
    }

    .btn-retry:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0 #02644a;
    }
  </style>
</head>
<body>

  <canvas id="gameCanvas"></canvas>

  <!-- CLEAN GAME OVER MODAL -->
  <div class="modal-overlay" id="gameOverModal">
    <div class="gameover-box">
      <div class="gameover-tag">NO SPACE LEFT!</div>
      <div class="gameover-sub">Try to clear more lines next time</div>

      <div class="score-res-box">
        <div style="font-size:12px; color:#94a3b8; font-weight:800; letter-spacing:1px;">FINAL SCORE</div>
        <div class="score-res-val" id="resScore">0</div>
      </div>

      <button class="btn-retry" onclick="restartGame()">Play Again</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const VIEW_W = 380;
    const VIEW_H = 760;
    let scale = 1;

    function resize() {
      scale = Math.min(window.innerWidth / VIEW_W, window.innerHeight / VIEW_H);
      canvas.width = VIEW_W * scale;
      canvas.height = VIEW_H * scale;
    }
    window.addEventListener('resize', resize);
    resize();

    // AUDIO
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, dur = 0.08) {
      try {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.frequency.value = freq;
        g.gain.setValueAtTime(0.12, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch(e){}
    }

    // GAME STATE & PERMANENT HIGH SCORE STORAGE
    const BOARD_LEFT = 24;
    const BOARD_TOP = 155;
    const BOARD_SIZE = 332;
    const CELL_SIZE = (BOARD_SIZE - 18) / 8;

    let grid = Array(8).fill(null).map(() => Array(8).fill(0));
    let score = 0;
    // Guaranteed all-time High Score from phone memory
    let highScore = parseInt(localStorage.getItem('bb_alltime_high')) || 0;
    let combo = 0;
    let particles = [];
    let popups = [];

    // 3D BLOCK PALETTE
    const BLOCK_PALETTE = {
      base: '#2f6854',
      top: '#4fa385',
      bottom: '#1c4536',
      center: 'rgba(255, 255, 255, 0.45)'
    };

    // PIECES
    const PIECE_1X1 = { m: [[1]], w:1, h:1 };
    const PIECE_1X2 = { m: [[1,1]], w:2, h:1 };
    const PIECE_2X1 = { m: [[1],[1]], w:1, h:2 };
    const PIECE_1X3 = { m: [[1,1,1]], w:3, h:1 };
    const PIECE_3X1 = { m: [[1],[1],[1]], w:1, h:3 };
    const PIECE_2X2 = { m: [[1,1],[1,1]], w:2, h:2 };
    const PIECE_L   = { m: [[1,0],[1,0],[1,1]], w:2, h:3 };
    const PIECE_T   = { m: [[1,1,1],[0,1,0]], w:3, h:2 };
    const PIECE_3X3 = { m: [[1,1,1],[1,1,1],[1,1,1]], w:3, h:3 };

    let dock = [null, null, null];
    let dragging = null;

    // RETENTION ENGINE: LINE SAVER & DIFFICULTY CONTROLLER
    function spawnSmartDock() {
      let nearFullLines = [];
      for(let r=0; r<8; r++) {
        let filled = grid[r].filter(v => v === 1).length;
        if(filled >= 5 && filled <= 7) nearFullLines.push({ type: 'r', idx: r, empty: 8 - filled });
      }
      for(let c=0; c<8; c++) {
        let filled = 0;
        for(let r=0; r<8; r++) if(grid[r][c] === 1) filled++;
        if(filled >= 5 && filled <= 7) nearFullLines.push({ type: 'c', idx: c, empty: 8 - filled });
      }

      for(let i=0; i<3; i++) {
        if(score < 90000 && nearFullLines.length > 0 && Math.random() < 0.78) {
          const target = nearFullLines[Math.floor(Math.random() * nearFullLines.length)];
          if(target.empty <= 2) {
            dock[i] = (Math.random() < 0.5) ? PIECE_1X1 : (target.type === 'r' ? PIECE_1X2 : PIECE_2X1);
          } else {
            dock[i] = (target.type === 'r') ? PIECE_1X3 : PIECE_3X1;
          }
        } 
        else if (score < 90000) {
          const pool = [PIECE_1X1, PIECE_1X2, PIECE_2X1, PIECE_1X3, PIECE_3X1, PIECE_2X2];
          dock[i] = pool[Math.floor(Math.random() * pool.length)];
        } 
        else {
          const pool = [PIECE_2X2, PIECE_L, PIECE_T, PIECE_1X3, PIECE_3X1, PIECE_3X3];
          dock[i] = pool[Math.floor(Math.random() * pool.length)];
        }
      }

      checkNoSpaceLeft();
    }

    function checkNoSpaceLeft() {
      const remaining = dock.filter(s => s !== null);
      if(remaining.length === 0) return;

      let canPlaceAny = false;
      for(let shape of remaining) {
        for(let r=0; r<=8-shape.h; r++) {
          for(let c=0; c<=8-shape.w; c++) {
            if(canFit(shape.m, r, c)) {
              canPlaceAny = true;
              break;
            }
          }
          if(canPlaceAny) break;
        }
        if(canPlaceAny) break;
      }

      if(!canPlaceAny) {
        // High score sync before showing modal
        if(score > highScore) {
          highScore = score;
          localStorage.setItem('bb_alltime_high', highScore);
        }

        setTimeout(() => {
          document.getElementById('resScore').innerText = score;
          document.getElementById('gameOverModal').classList.add('active');
        }, 350);
      }
    }

    function restartGame() {
      document.getElementById('gameOverModal').classList.remove('active');
      grid = Array(8).fill(null).map(() => Array(8).fill(0));
      score = 0;
      combo = 0;
      spawnSmartDock();
    }

    // 3D BEVEL DRAWING
    function draw3DBlock(x, y, size, alpha = 1) {
      ctx.save();
      ctx.globalAlpha = alpha;

      ctx.fillStyle = BLOCK_PALETTE.base;
      ctx.beginPath();
      ctx.roundRect(x, y, size, size, 5);
      ctx.fill();

      // Top Highlight
      ctx.fillStyle = BLOCK_PALETTE.top;
      ctx.beginPath();
      ctx.moveTo(x, y); ctx.lineTo(x + size, y);
      ctx.lineTo(x + size - 4, y + 4); ctx.lineTo(x + 4, y + 4);
      ctx.closePath(); ctx.fill();

      ctx.beginPath();
      ctx.moveTo(x, y); ctx.lineTo(x + 4, y + 4);
      ctx.lineTo(x + 4, y + size - 4); ctx.lineTo(x, y + size);
      ctx.closePath(); ctx.fill();

      // Bottom Shadow
      ctx.fillStyle = BLOCK_PALETTE.bottom;
      ctx.beginPath();
      ctx.moveTo(x, y + size); ctx.lineTo(x + 4, y + size - 4);
      ctx.lineTo(x + size - 4, y + size - 4); ctx.lineTo(x + size, y + size);
      ctx.closePath(); ctx.fill();

      ctx.beginPath();
      ctx.moveTo(x + size, y); ctx.lineTo(x + size, y + size);
      ctx.lineTo(x + size - 4, y + size - 4); ctx.lineTo(x + size - 4, y + 4);
      ctx.closePath(); ctx.fill();

      ctx.fillStyle = BLOCK_PALETTE.center;
      ctx.fillRect(x + 6, y + 6, size - 12, size - 12);

      ctx.restore();
    }

    // 60FPS RENDERING
    let diamondRot = 0;
    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.save();
      ctx.scale(scale, scale);

      // 1. ALL-TIME HIGH SCORE (Crown + Value)
      ctx.fillStyle = '#ffd166';
      ctx.font = '900 20px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('👑 ' + highScore, 24, 46);

      ctx.fillStyle = '#ffffff';
      ctx.font = '22px sans-serif';
      ctx.fillText('⚙️', 332, 46);

      // 2. DIAMOND ROTATION
      diamondRot += 0.02;
      const scoreX = 190;
      const scoreY = 96;

      ctx.save();
      ctx.translate(scoreX, scoreY);
      ctx.rotate(diamondRot);
      const diaGrad = ctx.createLinearGradient(-26, -26, 26, 26);
      diaGrad.addColorStop(0, '#f72585');
      diaGrad.addColorStop(0.5, '#7209b7');
      diaGrad.addColorStop(1, '#4cc9f0');
      ctx.fillStyle = diaGrad;
      ctx.fillRect(-20, -20, 40, 40);
      ctx.restore();

      // 3. CURRENT SCORE
      const rainbowGrad = ctx.createLinearGradient(120, 0, 260, 0);
      rainbowGrad.addColorStop(0, '#4cc9f0');
      rainbowGrad.addColorStop(0.3, '#72efdd');
      rainbowGrad.addColorStop(0.6, '#ffd166');
      rainbowGrad.addColorStop(1, '#ff4d6d');

      ctx.fillStyle = rainbowGrad;
      ctx.font = '900 52px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(score, scoreX, 114);

      // 4. BOARD
      ctx.fillStyle = '#1f2428';
      ctx.beginPath();
      ctx.roundRect(BOARD_LEFT, BOARD_TOP, BOARD_SIZE, BOARD_SIZE, 12);
      ctx.fill();

      for(let r=0; r<8; r++) {
        for(let c=0; c<8; c++) {
          const cx = BOARD_LEFT + 9 + c * (CELL_SIZE + 2);
          const cy = BOARD_TOP + 9 + r * (CELL_SIZE + 2);
          ctx.fillStyle = '#2b3137';
          ctx.beginPath();
          ctx.roundRect(cx, cy, CELL_SIZE, CELL_SIZE, 4);
          ctx.fill();

          if(grid[r][c] === 1) {
            draw3DBlock(cx, cy, CELL_SIZE);
          }
        }
      }

      // 5. HOVER PREVIEW
      if(dragging) {
        const coords = getGridCoords(dragging.x, dragging.y - 70, dragging.shape);
        if(coords && canFit(dragging.shape.m, coords.r, coords.c)) {
          for(let r=0; r<dragging.shape.h; r++) {
            for(let c=0; c<dragging.shape.w; c++) {
              if(dragging.shape.m[r][c]) {
                const px = BOARD_LEFT + 9 + (coords.c + c) * (CELL_SIZE + 2);
                const py = BOARD_TOP + 9 + (coords.r + r) * (CELL_SIZE + 2);
                draw3DBlock(px, py, CELL_SIZE, 0.42);
              }
            }
          }
        }
      }

      // 6. DOCK PIECES
      const dockY = 560;
      const slotCenters = [75, 190, 305];
      for(let i=0; i<3; i++) {
        const shape = dock[i];
        if(shape && (!dragging || dragging.idx !== i)) {
          const uSize = 20;
          const startX = slotCenters[i] - (shape.w * uSize) / 2;
          const startY = dockY - (shape.h * uSize) / 2;

          for(let r=0; r<shape.h; r++) {
            for(let c=0; c<shape.w; c++) {
              if(shape.m[r][c]) {
                draw3DBlock(startX + c * uSize, startY + r * uSize, uSize);
              }
            }
          }
        }
      }

      // 7. DRAGGING PIECE
      if(dragging) {
        const uSize = CELL_SIZE;
        const dragX = dragging.x - (dragging.shape.w * uSize) / 2;
        const dragY = (dragging.y - 70) - (dragging.shape.h * uSize) / 2;

        for(let r=0; r<dragging.shape.h; r++) {
          for(let c=0; c<dragging.shape.w; c++) {
            if(dragging.shape.m[r][c]) {
              draw3DBlock(dragX + c * (uSize + 2), dragY + r * (uSize + 2), uSize, 0.95);
            }
          }
        }
      }

      // 8. PARTICLES
      for(let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.alpha;
        ctx.fillRect(p.x, p.y, p.size, p.size);
        p.x += p.vx; p.y += p.vy;
        p.alpha -= 0.035;
        if(p.alpha <= 0) particles.splice(i, 1);
      }
      ctx.globalAlpha = 1;

      // 9. POPUPS
      for(let i = popups.length - 1; i >= 0; i--) {
        const pop = popups[i];
        ctx.save();
        ctx.fillStyle = pop.color;
        ctx.font = `900 ${pop.size}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.shadowColor = 'rgba(0,0,0,0.6)';
        ctx.shadowBlur = 8;
        ctx.fillText(pop.text, pop.x, pop.y);
        ctx.restore();

        pop.y -= 1.2;
        pop.life--;
        if(pop.life <= 0) popups.splice(i, 1);
      }

      ctx.restore();
      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);

    // TOUCH LOGIC
    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (cx - rect.left) / scale,
        y: (cy - rect.top) / scale
      };
    }

    window.addEventListener('pointerdown', (e) => {
      const { x, y } = getPos(e);
      const slotCenters = [75, 190, 305];
      const dockY = 560;

      for(let i=0; i<3; i++) {
        if(dock[i]) {
          const d = Math.hypot(x - slotCenters[i], y - dockY);
          if(d < 55) {
            dragging = { idx: i, shape: dock[i], x: x, y: y };
            playBeep(450);
            break;
          }
        }
      }
    });

    window.addEventListener('pointermove', (e) => {
      if(!dragging) return;
      const { x, y } = getPos(e);
      dragging.x = x;
      dragging.y = y;
    });

    window.addEventListener('pointerup', () => {
      if(!dragging) return;
      const targetY = dragging.y - 70;
      const coords = getGridCoords(dragging.x, targetY, dragging.shape);

      if(coords && canFit(dragging.shape.m, coords.r, coords.c)) {
        let placedCount = 0;
        for(let r=0; r<dragging.shape.h; r++) {
          for(let c=0; c<dragging.shape.w; c++) {
            if(dragging.shape.m[r][c]) {
              grid[coords.r + r][coords.c + c] = 1;
              placedCount++;
            }
          }
        }

        dock[dragging.idx] = null;
        score += placedCount * 10;
        playBeep(320);

        // Instant High Score Update
        if(score > highScore) {
          highScore = score;
          localStorage.setItem('bb_alltime_high', highScore);
        }

        checkLineClears();

        if(dock.every(s => s === null)) {
          spawnSmartDock();
        } else {
          checkNoSpaceLeft();
        }
      }

      dragging = null;
    });

    function getGridCoords(x, y, shape) {
      const cellW = CELL_SIZE + 2;
      const startX = BOARD_LEFT + 9;
      const startY = BOARD_TOP + 9;

      const tlX = x - (shape.w * cellW) / 2;
      const tlY = y - (shape.h * cellW) / 2;

      const c = Math.round((tlX - startX) / cellW);
      const r = Math.round((tlY - startY) / cellW);

      return { r, c };
    }

    function canFit(m, r, c) {
      if(r < 0 || c < 0 || r + m.length > 8 || c + m[0].length > 8) return false;
      for(let i=0; i<m.length; i++) {
        for(let j=0; j<m[0].length; j++) {
          if(m[i][j] && grid[r+i][c+j] === 1) return false;
        }
      }
      return true;
    }

    function checkLineClears() {
      let rClears = [];
      let cClears = [];

      for(let r=0; r<8; r++) if(grid[r].every(v => v === 1)) rClears.push(r);
      for(let c=0; c<8; c++) {
        let full = true;
        for(let r=0; r<8; r++) if(grid[r][c] === 0) { full = false; break; }
        if(full) cClears.push(c);
      }

      const totalLines = rClears.length + cClears.length;

      if(totalLines > 0) {
        combo++;
        const linePoints = totalLines * 100 + (combo > 1 ? combo * 70 : 0);
        score += linePoints;

        if(score > highScore) {
          highScore = score;
          localStorage.setItem('bb_alltime_high', highScore);
        }

        popups.push({
          x: 190, y: 150,
          text: `+${linePoints}`,
          color: '#ffd166',
          size: 26, life: 40
        });

        if(combo > 1) {
          popups.push({
            x: 190, y: 310,
            text: `Combo ${combo}`,
            color: '#ffffff',
            size: 34, life: 50
          });
        }

        rClears.forEach(r => {
          grid[r].fill(0);
          for(let c=0; c<8; c++) spawnParticles(r, c);
        });
        cClears.forEach(c => {
          for(let r=0; r<8; r++) {
            grid[r][c] = 0;
            spawnParticles(r, c);
          }
        });

        playBeep(650, 0.25);
      } else {
        combo = 0;
      }
    }

    function spawnParticles(r, c) {
      const cx = BOARD_LEFT + 9 + c * (CELL_SIZE + 2) + CELL_SIZE/2;
      const cy = BOARD_TOP + 9 + r * (CELL_SIZE + 2) + CELL_SIZE/2;
      for(let i=0; i<6; i++) {
        particles.push({
          x: cx, y: cy,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          size: Math.random() * 4 + 3,
          color: Math.random() < 0.5 ? '#72efdd' : '#ffd166',
          alpha: 1
        });
      }
    }

    // START GAME
    spawnSmartDock();
  </script>
</body>
</html>
