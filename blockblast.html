<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Block Blast Pro 3D</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
    }

    body {
      background-color: #383e42;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #gameCanvas {
      background: #383e42;
      display: block;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>

  <canvas id="gameCanvas"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // MOBILE FIT SCALING
    const VIEW_W = 380;
    const VIEW_H = 760;
    let scale = 1;

    function resizeCanvas() {
      const windowW = window.innerWidth;
      const windowH = window.innerHeight;
      scale = Math.min(windowW / VIEW_W, windowH / VIEW_H);
      canvas.width = VIEW_W * scale;
      canvas.height = VIEW_H * scale;
      ctx.imageSmoothingEnabled = true;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // AUDIO
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, duration = 0.08) {
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e){}
    }

    // GAME CONSTANTS
    const GRID_SIZE = 8;
    const BOARD_LEFT = 24;
    const BOARD_TOP = 160;
    const BOARD_SIZE = 332;
    const CELL_SIZE = (BOARD_SIZE - 18) / 8; // approx 39.2px

    let grid = Array(8).fill(null).map(() => Array(8).fill(0));
    let score = 0;
    let highScore = parseInt(localStorage.getItem('bb_real_hs')) || 40455;
    let combo = 0;
    let particles = [];
    let popups = [];

    // BLOCK PALETTE
    const BLOCK_COLOR = {
      base: '#2f6854',
      top: '#459276',
      bottom: '#1e4638',
      shine: 'rgba(255, 255, 255, 0.45)'
    };

    // SHAPES
    const SHAPES = [
      { m: [[1]], w:1, h:1 },
      { m: [[1,1]], w:2, h:1 },
      { m: [[1],[1]], w:1, h:2 },
      { m: [[1,1,1]], w:3, h:1 },
      { m: [[1],[1],[1]], w:1, h:3 },
      { m: [[1,1,1,1]], w:4, h:1 },
      { m: [[1,1],[1,1]], w:2, h:2 },
      { m: [[1,1,1],[1,1,1],[1,1,1]], w:3, h:3 },
      { m: [[1,0],[1,0],[1,1]], w:2, h:3 },
      { m: [[1,1,1],[0,1,0]], w:3, h:2 },
      { m: [[1,1],[0,1],[0,1]], w:2, h:3 }
    ];

    let dock = [null, null, null];
    let dragging = null; // { idx, shape, x, y, startX, startY }

    function spawnDock() {
      for(let i=0; i<3; i++) {
        dock[i] = SHAPES[Math.floor(Math.random() * SHAPES.length)];
      }
    }
    spawnDock();

    // RENDER HELPER: DRAW 3D BEVELED BLOCK
    function draw3DBlock(x, y, size, alpha = 1) {
      ctx.save();
      ctx.globalAlpha = alpha;

      // Base
      ctx.fillStyle = BLOCK_COLOR.base;
      ctx.beginPath();
      ctx.roundRect(x, y, size, size, 5);
      ctx.fill();

      // Top Highlight Bevel
      ctx.fillStyle = BLOCK_COLOR.top;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + size, y);
      ctx.lineTo(x + size - 4, y + 4);
      ctx.lineTo(x + 4, y + 4);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + 4, y + 4);
      ctx.lineTo(x + 4, y + size - 4);
      ctx.lineTo(x, y + size);
      ctx.closePath();
      ctx.fill();

      // Bottom Dark Bevel
      ctx.fillStyle = BLOCK_COLOR.bottom;
      ctx.beginPath();
      ctx.moveTo(x, y + size);
      ctx.lineTo(x + 4, y + size - 4);
      ctx.lineTo(x + size - 4, y + size - 4);
      ctx.lineTo(x + size, y + size);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(x + size, y);
      ctx.lineTo(x + size, y + size);
      ctx.lineTo(x + size - 4, y + size - 4);
      ctx.lineTo(x + size - 4, y + 4);
      ctx.closePath();
      ctx.fill();

      // Inner Soft Center
      ctx.fillStyle = BLOCK_COLOR.shine;
      ctx.fillRect(x + 6, y + 6, size - 12, size - 12);

      ctx.restore();
    }

    // MAIN GAME LOOP (60 FPS)
    let diamondRot = 0;
    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.save();
      ctx.scale(scale, scale);

      // 1. TOP HEADER (Crown + High Score)
      ctx.fillStyle = '#ffb703';
      ctx.font = '900 20px sans-serif';
      ctx.fillText('👑 ' + highScore, 24, 46);

      ctx.fillStyle = '#ffffff';
      ctx.font = '22px sans-serif';
      ctx.fillText('⚙️', 332, 46);

      // 2. RAINBOW ROTATING DIAMOND BACKGROUND
      diamondRot += 0.015;
      const scoreCenterX = 190;
      const scoreCenterY = 96;

      if(combo > 0) {
        ctx.save();
        ctx.translate(scoreCenterX, scoreCenterY);
        ctx.rotate(diamondRot);
        const grad = ctx.createLinearGradient(-30, -30, 30, 30);
        grad.addColorStop(0, '#f72585');
        grad.addColorStop(0.5, '#7209b7');
        grad.addColorStop(1, '#4cc9f0');
        ctx.fillStyle = grad;
        ctx.fillRect(-22, -22, 44, 44);
        ctx.restore();
      }

      // 3. MAIN SCORE DISPLAY (Rainbow Gradient Style)
      const rainbowGrad = ctx.createLinearGradient(120, 0, 260, 0);
      rainbowGrad.addColorStop(0, '#4cc9f0');
      rainbowGrad.addColorStop(0.3, '#72efdd');
      rainbowGrad.addColorStop(0.6, '#ffd166');
      rainbowGrad.addColorStop(1, '#ff4d6d');

      ctx.fillStyle = rainbowGrad;
      ctx.font = '900 52px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(score, scoreCenterX, 114);

      // 4. 8x8 BOARD BACKGROUND
      ctx.fillStyle = '#272b2f';
      ctx.beginPath();
      ctx.roundRect(BOARD_LEFT, BOARD_TOP, BOARD_SIZE, BOARD_SIZE, 12);
      ctx.fill();

      // Empty Slot Grid
      for(let r=0; r<8; r++) {
        for(let c=0; c<8; c++) {
          const cx = BOARD_LEFT + 9 + c * (CELL_SIZE + 2);
          const cy = BOARD_TOP + 9 + r * (CELL_SIZE + 2);
          ctx.fillStyle = '#31373c';
          ctx.beginPath();
          ctx.roundRect(cx, cy, CELL_SIZE, CELL_SIZE, 4);
          ctx.fill();

          if(grid[r][c] === 1) {
            draw3DBlock(cx, cy, CELL_SIZE);
          }
        }
      }

      // 5. HOVER PREVIEW ON DRAG
      if(dragging) {
        const coords = getGridCoords(dragging.x, dragging.y - 70, dragging.shape);
        if(coords && canFit(dragging.shape.m, coords.r, coords.c)) {
          for(let r=0; r<dragging.shape.h; r++) {
            for(let c=0; c<dragging.shape.w; c++) {
              if(dragging.shape.m[r][c]) {
                const px = BOARD_LEFT + 9 + (coords.c + c) * (CELL_SIZE + 2);
                const py = BOARD_TOP + 9 + (coords.r + r) * (CELL_SIZE + 2);
                draw3DBlock(px, py, CELL_SIZE, 0.4);
              }
            }
          }
        }
      }

      // 6. BOTTOM DOCK PIECES
      const dockY = 560;
      const slotCenters = [75, 190, 305];

      for(let i=0; i<3; i++) {
        const shape = dock[i];
        if(shape && (!dragging || dragging.idx !== i)) {
          const uSize = 20;
          const startX = slotCenters[i] - (shape.w * uSize) / 2;
          const startY = dockY - (shape.h * uSize) / 2;

          for(let r=0; r<shape.h; r++) {
            for(let c=0; c<shape.w; c++) {
              if(shape.m[r][c]) {
                draw3DBlock(startX + c * uSize, startY + r * uSize, uSize);
              }
            }
          }
        }
      }

      // 7. DRAGGING PIECE (Under Finger with 70px Lift)
      if(dragging) {
        const uSize = CELL_SIZE;
        const dragDrawX = dragging.x - (dragging.shape.w * uSize) / 2;
        const dragDrawY = (dragging.y - 70) - (dragging.shape.h * uSize) / 2;

        for(let r=0; r<dragging.shape.h; r++) {
          for(let c=0; c<dragging.shape.w; c++) {
            if(dragging.shape.m[r][c]) {
              draw3DBlock(dragDrawX + c * (uSize + 2), dragDrawY + r * (uSize + 2), uSize, 0.95);
            }
          }
        }
      }

      // 8. PARTICLES BURST
      for(let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.alpha;
        ctx.fillRect(p.x, p.y, p.size, p.size);
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.03;
        if(p.alpha <= 0) particles.splice(i, 1);
      }
      ctx.globalAlpha = 1;

      // 9. COMBO & SCORE POPUPS
      for(let i = popups.length - 1; i >= 0; i--) {
        const pop = popups[i];
        ctx.save();
        ctx.fillStyle = pop.color;
        ctx.font = `900 ${pop.size}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.shadowColor = 'rgba(0,0,0,0.6)';
        ctx.shadowBlur = 8;
        ctx.fillText(pop.text, pop.x, pop.y);
        ctx.restore();

        pop.y -= 1.2;
        pop.life--;
        if(pop.life <= 0) popups.splice(i, 1);
      }

      ctx.restore();
      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);

    // TOUCH LOGIC
    function getCanvasPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (clientX - rect.left) / scale,
        y: (clientY - rect.top) / scale
      };
    }

    function onPointerDown(e) {
      const { x, y } = getCanvasPos(e);
      const slotCenters = [75, 190, 305];
      const dockY = 560;

      for(let i=0; i<3; i++) {
        if(dock[i]) {
          const dist = Math.hypot(x - slotCenters[i], y - dockY);
          if(dist < 55) {
            dragging = { idx: i, shape: dock[i], x: x, y: y };
            playBeep(450);
            break;
          }
        }
      }
    }

    function onPointerMove(e) {
      if(!dragging) return;
      const { x, y } = getCanvasPos(e);
      dragging.x = x;
      dragging.y = y;
    }

    function onPointerUp() {
      if(!dragging) return;
      const targetY = dragging.y - 70;
      const coords = getGridCoords(dragging.x, targetY, dragging.shape);

      if(coords && canFit(dragging.shape.m, coords.r, coords.c)) {
        // Place piece
        let placedCount = 0;
        for(let r=0; r<dragging.shape.h; r++) {
          for(let c=0; c<dragging.shape.w; c++) {
            if(dragging.shape.m[r][c]) {
              grid[coords.r + r][coords.c + c] = 1;
              placedCount++;
            }
          }
        }

        dock[dragging.idx] = null;
        score += placedCount * 10;
        playBeep(320);

        checkLineClears();

        if(dock.every(s => s === null)) {
          spawnDock();
        }
      }

      dragging = null;
    }

    window.addEventListener('pointerdown', onPointerDown);
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);

    // COORD & FIT CHECK
    function getGridCoords(x, y, shape) {
      const cellW = CELL_SIZE + 2;
      const startX = BOARD_LEFT + 9;
      const startY = BOARD_TOP + 9;

      const topLeftX = x - (shape.w * cellW) / 2;
      const topLeftY = y - (shape.h * cellW) / 2;

      const c = Math.round((topLeftX - startX) / cellW);
      const r = Math.round((topLeftY - startY) / cellW);

      return { r, c };
    }

    function canFit(matrix, r, c) {
      if(r < 0 || c < 0 || r + matrix.length > 8 || c + matrix[0].length > 8) return false;
      for(let i=0; i<matrix.length; i++) {
        for(let j=0; j<matrix[0].length; j++) {
          if(matrix[i][j] && grid[r+i][c+j] === 1) return false;
        }
      }
      return true;
    }

    // LINE CLEARING, BURSTS & COMBO LOGIC
    function checkLineClears() {
      let rClears = [];
      let cClears = [];

      for(let r=0; r<8; r++) {
        if(grid[r].every(v => v === 1)) rClears.push(r);
      }
      for(let c=0; c<8; c++) {
        let full = true;
        for(let r=0; r<8; r++) {
          if(grid[r][c] === 0) { full = false; break; }
        }
        if(full) cClears.push(c);
      }

      const totalLines = rClears.length + cClears.length;

      if(totalLines > 0) {
        combo++;
        const linePoints = totalLines * 100 + (combo > 1 ? combo * 70 : 0);
        score += linePoints;

        if(score > highScore) {
          highScore = score;
          localStorage.setItem('bb_real_hs', highScore);
        }

        // Spawn Floating Text (+105 / Combo 3!)
        popups.push({
          x: 190, y: 150,
          text: `+${linePoints}`,
          color: '#ffd166',
          size: 26, life: 40
        });

        if(combo > 1) {
          popups.push({
            x: 190, y: 310,
            text: `Combo ${combo}`,
            color: '#ffffff',
            size: 34, life: 50
          });
        }

        // Particle Burst
        rClears.forEach(r => {
          grid[r].fill(0);
          for(let c=0; c<8; c++) spawnParticlesAtCell(r, c);
        });
        cClears.forEach(c => {
          for(let r=0; r<8; r++) {
            grid[r][c] = 0;
            spawnParticlesAtCell(r, c);
          }
        });

        playBeep(650, 0.25);
      } else {
        combo = 0;
      }
    }

    function spawnParticlesAtCell(r, c) {
      const cx = BOARD_LEFT + 9 + c * (CELL_SIZE + 2) + CELL_SIZE/2;
      const cy = BOARD_TOP + 9 + r * (CELL_SIZE + 2) + CELL_SIZE/2;
      for(let i=0; i<6; i++) {
        particles.push({
          x: cx, y: cy,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          size: Math.random() * 4 + 3,
          color: Math.random() < 0.5 ? '#72efdd' : '#ffd166',
          alpha: 1
        });
      }
    }
  </script>
</body>
</html>
